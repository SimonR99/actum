<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SpaceWalker Interface</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {
  --bg: #0b1118;
  --bg-soft: #131d29;
  --card: #0f1823;
  --card-2: #101a27;
  --line: #223445;
  --ink: #e8f2ff;
  --muted: #9eb1c8;
  --accent: #ffd36b;
  --accent-2: #5fd0ff;
  --ok: #59da8e;
  --warn: #ff976b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
  color: var(--ink);
  min-height: 100vh;
  background:
    radial-gradient(80rem 80rem at -8% -20%, #1f3146 0%, transparent 56%),
    radial-gradient(40rem 40rem at 108% -16%, #3a3122 0%, transparent 45%),
    linear-gradient(155deg, var(--bg) 0%, #090e14 100%);
}

.top {
  backdrop-filter: blur(8px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .75rem;
  border-bottom: 1px solid var(--line);
  background: #0c141faa;
  padding: .95rem 1.15rem;
}
.brand { display: flex; gap: .7rem; align-items: center; }
.dot { width: .66rem; height: .66rem; border-radius: 999px; background: #405266; box-shadow: 0 0 0 .2rem #1a2635; }
.dot.live { background: var(--ok); box-shadow: 0 0 .8rem #59da8e88, 0 0 0 .2rem #1a2635; }
.title { font-family: 'Space Grotesk', ui-sans-serif, sans-serif; font-weight: 700; letter-spacing: .045em; }
.sub { color: var(--muted); font-size: .82rem; }

.rightTop { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; justify-content: flex-end; }
.chip { border: 1px solid var(--line); background: #121e2b; color: var(--muted); border-radius: 999px; padding: .23rem .58rem; font-size: .74rem; }
.chip.ok { color: var(--ok); border-color: #2e6249; background: #12251c; }
.chip.warn { color: var(--warn); border-color: #6f4030; background: #2b1913; }

.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  background: #101926;
  border-radius: 999px;
  padding: .15rem;
}
.seg button {
  border: none;
  background: transparent;
  color: var(--muted);
  font-weight: 700;
  font-size: .78rem;
  letter-spacing: .02em;
  border-radius: 999px;
  padding: .35rem .82rem;
  cursor: pointer;
}
.seg button.active { background: #233649; color: #e7f3ff; }

main {
  padding: 1rem;
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(310px, .9fr);
  gap: 1rem;
  height: calc(100vh - 74px);
  min-height: 0;
  overflow: hidden;
}
body[data-view="chat"] main {
  grid-template-columns: minmax(0, 1fr);
}
body[data-view="chat"] .rightCol {
  display: none;
}

.panel {
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  background: linear-gradient(180deg, var(--card) 0%, #0d1621 100%);
  display: flex;
  flex-direction: column;
  min-height: 0;
  height: 100%;
}
.panel h2 {
  font-family: 'Space Grotesk', ui-sans-serif, sans-serif;
  text-transform: uppercase;
  letter-spacing: .09em;
  font-size: .8rem;
  color: #b8cbe2;
  border-bottom: 1px solid var(--line);
  padding: .8rem .95rem;
}

.chatBody {
  display: flex;
  flex-direction: column;
  min-height: 0;
  height: 100%;
  overflow: hidden;
}
#chatFeed {
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: .7rem;
  overflow-y: auto;
  min-height: 240px;
  flex: 1;
  min-height: 0;
}
.msg {
  max-width: min(85%, 700px);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: .58rem .72rem;
  line-height: 1.34;
  animation: rise .22s ease-out;
}
.msg.user { align-self: flex-end; background: #1f3348; border-color: #2f4d69; }
.msg.assistant { align-self: flex-start; background: #141f2d; }
.msg .who { font-size: .67rem; letter-spacing: .07em; text-transform: uppercase; color: #87b1d8; margin-bottom: .2rem; }
.msg.user .who { color: #9ecaf0; }

.thinking {
  align-self: flex-start;
  color: var(--muted);
  font-size: .8rem;
  padding: .1rem .2rem;
}

.composer {
  border-top: 1px solid var(--line);
  display: flex;
  gap: .55rem;
  padding: .75rem;
  background: #0f1824;
}
#cmd {
  flex: 1;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--ink);
  background: #0b131d;
  padding: .62rem .75rem;
  font: inherit;
}
#cmd:focus { outline: none; border-color: #3d5f82; }
.sendBtn {
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), #ffe5a6);
  color: #2c210c;
  font-weight: 800;
  cursor: pointer;
  padding: .58rem .96rem;
}

.rightCol {
  display: grid;
  gap: 1rem;
  grid-template-rows: auto minmax(0, 1fr);
  min-height: 0;
  overflow: hidden;
}
.controls {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: linear-gradient(180deg, #101928 0%, #0f1724 100%);
  padding: .8rem;
  display: grid;
  gap: .75rem;
}
.row {
  display: flex;
  gap: .55rem;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}
.saveLabel {
  color: var(--muted);
  font-size: .8rem;
  display: flex;
  gap: .35rem;
  align-items: center;
}
.smallBtn {
  border: 1px solid #3b556f;
  background: #1c2e42;
  color: #d9ecff;
  border-radius: 9px;
  cursor: pointer;
  font-weight: 700;
  padding: .43rem .78rem;
}

.stack {
  display: grid;
  gap: 1rem;
  min-height: 0;
  grid-template-rows: minmax(0, 1.12fr) minmax(0, 1fr) minmax(0, 1fr);
  overflow: hidden;
}
#cameraWrap {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  height: 100%;
  background: #090f16;
}
#camera { width: 100%; height: 100%; object-fit: cover; display: block; }
#cameraPh {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: .9rem;
  background: linear-gradient(130deg, #0f1723, #0b1119);
}

#traceLog {
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: .42rem;
  padding: .75rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #0e1723;
  min-height: 0;
}
.ev {
  border-left: 3px solid #2f475f;
  background: #122032;
  border-radius: 8px;
  padding: .42rem .55rem;
  font-size: .8rem;
}
.ev .ts { color: #88a1bb; font-size: .68rem; margin-bottom: .16rem; }
.ev.speak { border-color: #7ac7ff; }
.ev.navigate,.ev.rotate { border-color: #7ae3b6; }
.ev.gripper { border-color: #f6be5f; }
.ev.look { border-color: #8eaef7; }
.ev.remember,.ev.recall { border-color: #ffd36b; }
.ev.done { border-color: #59da8e; }
.ev.status { border-color: #b3c1d0; }

#mtWrap {
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #0e1723;
  min-height: 0;
}
#mt { width: 100%; border-collapse: collapse; }
#mt td { padding: .42rem .52rem; border-bottom: 1px solid #1b2939; font-size: .8rem; vertical-align: top; }
#mt td:first-child { color: #ffd988; width: 40%; }

#toast {
  position: fixed;
  right: 1rem;
  bottom: 1rem;
  z-index: 50;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #121d2b;
  color: var(--ink);
  padding: .52rem .78rem;
  opacity: 0;
  transform: translateY(8px);
  transition: .22s ease;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateY(0); }

@keyframes rise {
  from { opacity: .45; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 980px) {
  html, body { overflow: auto; }
  main { grid-template-columns: 1fr; height: auto; overflow: visible; }
  .rightCol { grid-template-rows: auto; }
  .stack { grid-template-rows: auto auto auto; }
  #cameraWrap { aspect-ratio: 4/3; height: auto; }
}
</style>
</head>
<body data-view="chat">
<header class="top">
  <div class="brand">
    <div id="dot" class="dot"></div>
    <div>
      <div class="title" id="robotTitle">SPACEWALKER INTERFACE</div>
      <div class="sub">Choose chat-only results view or full engineering trace view</div>
    </div>
  </div>
  <div class="rightTop">
    <div class="seg" id="viewSeg">
      <button id="viewChat" class="active" onclick="setViewMode('chat')">Chat only</button>
      <button id="viewFull" onclick="setViewMode('full')">Full trace</button>
    </div>
    <span id="wsChip" class="chip">ws: offline</span>
    <span id="camChip" class="chip warn">camera: waiting</span>
    <span id="modeChip" class="chip">mode: -</span>
  </div>
</header>

<main>
  <section class="panel chatBody">
    <h2>Conversation</h2>
    <div id="chatFeed">
      <div class="msg assistant">
        <div class="who">spacewalker</div>
        <div>Ready. In chat-only mode you only see user requests and final answers.</div>
      </div>
    </div>
    <div class="composer">
      <input id="cmd" placeholder="Send a command..." autocomplete="off">
      <button class="sendBtn" onclick="sendCmd()">Send</button>
    </div>
  </section>

  <aside class="rightCol">
    <div class="controls">
      <div class="row">
        <div class="seg">
          <button id="modeLocal" onclick="setMode('local')">Local</button>
          <button id="modeUnitree" onclick="setMode('unitree')">Unitree</button>
        </div>
        <button class="smallBtn" onclick="applyMode()">Apply mode</button>
      </div>
      <div class="row">
        <label class="saveLabel"><input type="checkbox" id="saveMode" checked> Save mode as default</label>
      </div>
    </div>

    <div class="stack">
      <section class="panel">
        <h2>Live camera</h2>
        <div style="padding:.75rem;">
          <div id="cameraWrap">
            <img id="camera" alt="Camera feed">
            <div id="cameraPh">Waiting for camera frames...</div>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>Action trace</h2>
        <div id="traceLog"></div>
      </section>

      <section class="panel">
        <h2>Memory</h2>
        <div id="mtWrap"><table id="mt"></table></div>
      </section>
    </div>
  </aside>
</main>

<div id="toast"></div>

<script>
const dot = document.getElementById('dot');
const wsChip = document.getElementById('wsChip');
const camChip = document.getElementById('camChip');
const modeChip = document.getElementById('modeChip');
const robotTitle = document.getElementById('robotTitle');

const chatFeed = document.getElementById('chatFeed');
const traceLog = document.getElementById('traceLog');
const mt = document.getElementById('mt');
const cam = document.getElementById('camera');
const camPh = document.getElementById('cameraPh');
const cmd = document.getElementById('cmd');
const toast = document.getElementById('toast');

let pendingMode = 'local';
let lastFrameAt = 0;
let viewMode = 'chat';
let streamQueue = Promise.resolve();

function showToast(text) {
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

function setViewMode(mode) {
  viewMode = mode;
  document.body.dataset.view = mode;
  document.getElementById('viewChat').classList.toggle('active', mode === 'chat');
  document.getElementById('viewFull').classList.toggle('active', mode === 'full');
  showToast(mode === 'chat' ? 'Chat-only view enabled' : 'Full trace view enabled');
}

function setMode(mode) {
  pendingMode = mode;
  document.getElementById('modeLocal').classList.toggle('active', mode === 'local');
  document.getElementById('modeUnitree').classList.toggle('active', mode === 'unitree');
}

function addChatMessage(who, text) {
  const box = document.createElement('div');
  box.className = `msg ${who === 'user' ? 'user' : 'assistant'}`;
  const tag = who === 'user' ? 'operator' : 'spacewalker';
  box.innerHTML = `<div class="who">${tag}</div><div>${text}</div>`;
  chatFeed.appendChild(box);
  chatFeed.scrollTop = chatFeed.scrollHeight;
  return box;
}

function streamAssistantText(text) {
  streamQueue = streamQueue.then(async () => {
    const box = document.createElement('div');
    box.className = 'msg assistant';
    box.innerHTML = '<div class="who">spacewalker</div><div></div>';
    chatFeed.appendChild(box);
    chatFeed.scrollTop = chatFeed.scrollHeight;

    const target = box.children[1];
    for (const ch of text) {
      target.textContent += ch;
      chatFeed.scrollTop = chatFeed.scrollHeight;
      await new Promise(r => setTimeout(r, 8));
    }
  });
}

function renderTraceActions(actions) {
  for (const a of actions) {
    const row = document.createElement('div');
    row.className = `ev ${a.type || ''}`;
    const ts = new Date((a.time || Date.now() / 1000) * 1000).toLocaleTimeString();

    let detail = '';
    if (a.type === 'speak') detail = a.text || '';
    else if (a.type === 'navigate') detail = `${a.direction} ${a.distance_m}m`;
    else if (a.type === 'rotate') detail = `${a.degrees > 0 ? '+' : ''}${a.degrees} deg`;
    else if (a.type === 'gripper') detail = a.action || '';
    else if (a.type === 'remember') detail = `${a.key} = ${a.value}`;
    else if (a.type === 'done') detail = a.summary || '';
    else if (a.type === 'status') detail = a.message || '';
    else detail = JSON.stringify(a);

    row.innerHTML = `<div class="ts">${ts} · ${a.type || 'event'}</div>${detail}`;
    traceLog.appendChild(row);
    traceLog.scrollTop = traceLog.scrollHeight;
  }
}

function cleanText(value) {
  if (!value) return '';
  return String(value)
    .replace(/<\|"\|>/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function extractAssistantResult(actions) {
  const speak = cleanText(
    actions
      .filter(a => a.type === 'speak' && a.text)
      .map(a => a.text)
      .join(' ')
  );
  if (speak) return speak;

  const done = cleanText((actions.find(a => a.type === 'done' && a.summary) || {}).summary);
  if (done) return done;

  const status = cleanText(
    actions
      .filter(a => a.type === 'status' && a.message)
      .map(a => a.message)
      .join(' ')
  );
  return status || 'Task complete.';
}

function renderMem(data) {
  mt.innerHTML = Object.entries(data).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
}

async function refreshSettings() {
  const r = await fetch('/settings');
  const s = await r.json();

  setMode(s.mode || 'local');
  modeChip.textContent = `mode: ${s.mode || 'local'}`;
  modeChip.className = 'chip' + ((s.mode === 'unitree' && !s.hardware_connected) ? ' warn' : '');

  if (s.name) {
    const name = String(s.name);
    robotTitle.textContent = `${name.toUpperCase()} INTERFACE`;
    document.title = `${name} Interface`;
  }
}

async function applyMode() {
  const persist = document.getElementById('saveMode').checked;
  const r = await fetch('/settings/mode', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mode: pendingMode, persist })
  });
  const m = await r.json();
  showToast(m.message || 'Mode updated');
  await refreshSettings();
}

async function sendCmd() {
  const t = cmd.value.trim();
  if (!t) return;

  addChatMessage('user', t);
  cmd.value = '';

  const thinking = document.createElement('div');
  thinking.className = 'thinking';
  thinking.textContent = 'spacewalker is thinking...';
  chatFeed.appendChild(thinking);
  chatFeed.scrollTop = chatFeed.scrollHeight;

  const r = await fetch('/command', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: t })
  });

  if (!r.ok) {
    thinking.remove();
    showToast('Failed to queue command');
    return;
  }

  // Remove thinking hint when first assistant response for this turn appears.
  setTimeout(() => {
    if (thinking.isConnected) thinking.remove();
  }, 3500);
}

cmd.addEventListener('keydown', e => { if (e.key === 'Enter') sendCmd(); });

const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${wsProto}://${location.host}/events`);

ws.onopen = () => {
  dot.className = 'dot live';
  wsChip.textContent = 'ws: live';
  wsChip.className = 'chip ok';
};

ws.onclose = () => {
  dot.className = 'dot';
  wsChip.textContent = 'ws: offline';
  wsChip.className = 'chip warn';
};

ws.onmessage = e => {
  const m = JSON.parse(e.data);

  if (m.type === 'frame') {
    cam.src = `data:image/jpeg;base64,${m.jpeg}`;
    camPh.style.display = 'none';
    camChip.textContent = 'camera: live';
    camChip.className = 'chip ok';
    lastFrameAt = Date.now();
    return;
  }

  if (m.type === 'memory') {
    renderMem(m.data || {});
    return;
  }

  if (m.type === 'settings') {
    setMode(m.mode || 'local');
    modeChip.textContent = `mode: ${m.mode || 'local'}`;
    modeChip.className = 'chip' + ((m.mode === 'unitree' && !m.hardware_connected) ? ' warn' : '');
    return;
  }

  if (m.type === 'turn') {
    const actions = m.actions || [];
    renderTraceActions(actions);
    const result = extractAssistantResult(actions);
    streamAssistantText(result);
  }
};

setInterval(() => {
  if (Date.now() - lastFrameAt > 2500) {
    camChip.textContent = 'camera: no frames';
    camChip.className = 'chip warn';
    camPh.style.display = 'flex';
  }
}, 1000);

refreshSettings();
</script>
</body>
</html>
