version: '3.8'

services:
  # ── Main robot agent service (headless or web server) ──────────────────────
  robo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA_VERSION: "12.4.1"
        UBUNTU_VERSION: "22.04"
    
    image: vlm-g1:latest
    container_name: vlm-g1-agent
    
    # GPU support (requires nvidia-docker or Docker 20.10+)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # Environment variables
    environment:
      - PORT=8000
      - MODEL_PATH=/root/.cache/huggingface/hub/litert-community/gemma-4-E2B-it-litert-lm/snapshots/*/gemma-4-E2B-it.litertlm
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Audio device (adjust if needed: hw:1,0 for different card)
      - ROBO_AUDIO_DEVICE=hw:0,0
      # Camera mode: auto, csi, usb, or device index
      - ROBO_CAMERA=usb
    
    # Volumes for persistence + hardware access
    volumes:
      # Config file (host config.json → container)
      - ./config.json:/workspace/config.json:ro
      
      # Model cache (persistent across runs)
      - huggingface-cache:/root/.cache/huggingface
      
      # Agent memory + logs
      - ./logs:/workspace/logs
      
      # Hardware access (if robot is on same host)
      # Uncomment to enable hardware bridge
      # - /dev/ttyUSB0:/dev/ttyUSB0  # Serial ports (adjust as needed)
      # - /dev/snd:/dev/snd            # Audio devices
      # - /dev/video0:/dev/video0      # Camera device (USB or CSI)
    
    # Ports
    ports:
      - "8000:8000"  # Web dashboard (headless mode: not used)
    
    # Allow container to access host network (for robot communication if needed)
    # Uncomment if robot is on a different interface:
    # network_mode: host
    
    # Interactive terminal (for text input)
    stdin_open: true
    tty: true
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Named volume for model caching (shared across runs)
volumes:
  huggingface-cache:
    driver: local
