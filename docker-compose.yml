name: actum

services:
  # ── Main robot agent service (headless or web server) ──────────────────────
  actum:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA_VERSION: "12.4.1"
        UBUNTU_VERSION: "22.04"
    
    image: actum:latest
    container_name: actum-agent
    
    # GPU support is injected at runtime by run-server.sh when nvidia-smi is available.

    # API keys (OPENAI_API_KEY, …) loaded from the project .env if present.
    env_file:
      - path: .env
        required: false

    # Environment variables
    environment:
      - PORT=8000
      - MODEL_PATH=/root/.cache/huggingface/models--litert-community--gemma-4-E2B-it-litert-lm/snapshots/*/gemma-4-E2B-it.litertlm
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Audio device (adjust if needed: hw:1,0 for different card)
      - ACTUM_AUDIO_DEVICE=plughw:2,0
      # Camera mode: auto, csi, usb, or device index
      - ACTUM_CAMERA=auto
      # PULSE_SERVER is injected at runtime by run-server.sh if PulseAudio is present
    
    # All hardware devices (/dev/snd, /dev/video*) and the PulseAudio socket are
    # injected at runtime by run-server.sh so the container works on any robot
    # regardless of which devices are present on a given host.

    # Volumes for persistence + hardware access
    volumes:
      # Config file (host config.json → container)
      - ./config.json:/workspace/config.json
      
      # Model cache (persistent across runs)
      - actum-huggingface:/root/.cache/huggingface

      # pip wheel cache (persistent across runs) so the entrypoint's lerobot
      # install doesn't recompile native deps like blosc on every start.
      - actum-pip-cache:/root/.cache/pip

      # Agent memory + logs
      - ./logs:/workspace/logs
      
      # PulseAudio socket is injected at runtime by run-server.sh if present
      
      # Hardware access (if robot is on same host)
      # Uncomment to enable hardware bridge
      # - /dev/ttyUSB0:/dev/ttyUSB0  # Serial ports (adjust as needed)
    
    # Port mapping for bridge networking (default).
    # run-server.sh overrides to network_mode: host for Unitree robots, which
    # need host networking for CycloneDDS multicast — but host networking breaks
    # /sys/devices/system/cpu/possible on some kernels (Raspberry Pi 6.8.x),
    # causing onnxruntime to crash.
    ports:
      - "8000:8000"
    
    # Interactive terminal (for text input)
    stdin_open: true
    tty: true
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Named volumes (shared across runs)
volumes:
  actum-huggingface:
    name: actum-huggingface
    driver: local
  actum-pip-cache:
    name: actum-pip-cache
    driver: local
